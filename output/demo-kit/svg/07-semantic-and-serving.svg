<title id="title">Semantic Layer nằm ở đâu?</title>
<desc id="desc">Một DWH, hai đường serving được quản trị; không dựng Warehouse thứ hai và không dùng API semantic trả phí.. Sơ đồ hệ thống đã triển khai; phạm vi demo local.</desc>
