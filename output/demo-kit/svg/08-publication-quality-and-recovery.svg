<text x="100" y="574" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087E79" text-anchor="start" data-max-width="1780">CONSUMER ĐỘC LẬP VỚI WORKING STATE</text>
<text x="100" y="623" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="1690">Superset đang pin R0 → mọi chart tiếp tục đọc cùng R0</text>
<text x="100" y="662" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="1690">Sau publish: bàn giao URL pin R1 là bước riêng; pipeline không tự sửa dashboard đang mở.</text>
<rect x="72" y="728" width="556" height="245" rx="18" fill="#FCECEF"/>
<text x="96" y="766" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#AE3949" text-anchor="start" data-max-width="508">CHECK FAIL / EXPORT THIẾU</text>
<text x="96" y="798.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">R1 không được publish; giữ R0. Source</text>
<text x="96" y="832.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">warning được giải thích; schema, grain,</text>
<text x="96" y="867.6" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">FK, parity errors phải chặn.</text>
<rect x="682" y="728" width="556" height="245" rx="18" fill="#EAF1FD"/>
<text x="706" y="766" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#2458B5" text-anchor="start" data-max-width="508">RETRY / ACK MẤT</text>
<text x="706" y="798.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">Replay không nhân đôi source versions.</text>
<text x="706" y="832.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">Sau commit bị mất ACK: xác minh output</text>
<text x="706" y="867.6" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">đã lưu; không tự ghi lại hoặc reset.</text>
<rect x="1292" y="728" width="556" height="245" rx="18" fill="#FFF3DD"/>
<text x="1316" y="766" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#966119" text-anchor="start" data-max-width="508">RESTORE ĐÃ KIỂM RIÊNG</text>
<text x="1316" y="798.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">DWH vào target mới: 102,056 giây; live</text>
<text x="1316" y="832.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">không bị ghi đè. App restore / host-loss</text>
<text x="1316" y="867.6" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">recovery chưa nghiệm thu.</text>
