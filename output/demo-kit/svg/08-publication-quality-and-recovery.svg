<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FB"/>
<rect x="0" y="0" width="18" height="1080" rx="0" fill="#2458B5"/>
<text x="72" y="53" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#2458B5" text-anchor="start" data-max-width="1808">SALES &amp; CUSTOMER ANALYTICS WAREHOUSE</text>
<text x="1848" y="53" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52647B" text-anchor="end" data-max-width="1808">IMPLEMENTED DEMO  /  2026-10-19</text>
<text x="72" y="123" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="1776">Không công bố dữ liệu đang xử lý dở</text>
<text x="72" y="169" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="1776">R0 / R1 là nhãn minh họa release. Publication là giao dịch trong PostgreSQL, không phải distributed transaction.</text>
<polyline points="72,1007 1848,1007" fill="none" stroke="#D7E1EB" stroke-width="2" stroke-linejoin="round"/>
<text x="72" y="1046" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="1808">Portfolio độc lập • Olist • Không đại diện kiến trúc Abbott / Concentrix</text>
<text x="1848" y="1046" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52647B" text-anchor="end" data-max-width="1808">ĐỐI CHIẾU CODE VÀ EVIDENCE   |   08 / 10</text>
<rect x="72" y="250" width="408" height="226" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="72" y="270" width="5" height="186" rx="2" fill="#6650A8"/>
<text x="98" y="294.0" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="356">1 Build candidate R1</text>
<text x="98" y="342.37" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">Fixed source_cut</text>
<text x="98" y="390.11" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">dbt tests + DQ gates</text>
<rect x="528" y="250" width="408" height="226" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="528" y="270" width="5" height="186" rx="2" fill="#6650A8"/>
<text x="554" y="294.0" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="356">2 Snapshot R1</text>
<text x="554" y="342.37" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">7 dims + 3 facts</text>
<text x="554" y="390.11" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">Same-release FK / hashes</text>
<rect x="984" y="250" width="408" height="226" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="984" y="270" width="5" height="186" rx="2" fill="#6650A8"/>
<text x="1010" y="294.0" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="356">3 Semantic R1</text>
<text x="1010" y="342.37" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">5 exports đầy đủ</text>
<text x="1010" y="390.11" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">Binding + SQL parity</text>
<rect x="1440" y="250" width="408" height="226" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="1440" y="270" width="5" height="186" rx="2" fill="#6650A8"/>
<text x="1466" y="294.0" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="356">4 Publish R1</text>
<text x="1466" y="342.37" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">Owner + fence hợp lệ</text>
<text x="1466" y="390.11" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">Atomic pointer + event</text>
<polyline points="486,361 522,361" fill="none" stroke="#6650A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<polyline points="942,361 978,361" fill="none" stroke="#6650A8" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
