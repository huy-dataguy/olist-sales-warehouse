<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Mỗi lớp dữ liệu có một trách nhiệm</title>
<desc id="desc">Raw → accepted versions → working models → immutable DWH → governed serving. Không phải Delta Lake.. Sơ đồ hệ thống đã triển khai; phạm vi demo local.</desc>
<defs>
