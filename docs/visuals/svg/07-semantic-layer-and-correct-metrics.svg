<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Semantic Layer: định nghĩa một lần, tính đúng grain</title>
<desc id="desc">Ví dụ AOV: tổng giá trị hàng delivered / số đơn delivered, không lấy trung bình các AOV con.. Sơ đồ thiết kế; chưa nghiệm thu runtime.</desc>
<defs>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647B"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2458B5"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087E79"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AE3949"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6650A8"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F4F7FB"/>
<rect x="0" y="0" width="18" height="1080" rx="0" fill="#2458B5"/>
<text x="72" y="53" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#2458B5" text-anchor="start" data-max-width="1808">SALES &amp; CUSTOMER ANALYTICS WAREHOUSE</text>
<text x="1848" y="53" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52647B" text-anchor="end" data-max-width="1808">DESIGN BASELINE 2.0  /  15.10.2026</text>
<text x="72" y="123" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="1776">Semantic Layer: định nghĩa một lần, tính đúng grain</text>
<text x="72" y="169" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="1776">Ví dụ AOV: tổng giá trị hàng delivered / số đơn delivered, không lấy trung bình các AOV con.</text>
<polyline points="72,1007 1848,1007" fill="none" stroke="#D7E1EB" stroke-width="2" stroke-linejoin="round"/>
<text x="72" y="1046" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="1808">Portfolio độc lập • Olist • Không đại diện kiến trúc Abbott / Concentrix</text>
<text x="1848" y="1046" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52647B" text-anchor="end" data-max-width="1808">THIẾT KẾ, CHƯA NGHIỆM THU HỆ THỐNG   |   07 / 09</text>
<rect x="72" y="232" width="456" height="170" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="72" y="252" width="5" height="130" rx="2" fill="#2458B5"/>
<text x="98" y="276.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="404">fct_order_items</text>
<text x="98" y="326.99" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="404">SUM(price), status = delivered</text>
<rect x="72" y="456" width="456" height="170" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="72" y="476" width="5" height="130" rx="2" fill="#2458B5"/>
<text x="98" y="500.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="404">fct_orders</text>
<text x="98" y="550.99" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="404">SUM(delivered_order_count)</text>
<rect x="596" y="232" width="534" height="170" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="596" y="252" width="5" height="130" rx="2" fill="#6650A8"/>
<text x="622" y="276.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="482">Aggregate tại grain chung</text>
<text x="622" y="326.99" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="482">purchase month + buyer state</text>
<rect x="596" y="456" width="534" height="170" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="596" y="476" width="5" height="130" rx="2" fill="#6650A8"/>
<text x="622" y="500.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="482">Aggregate tại grain chung</text>
<text x="622" y="550.99" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="482">purchase month + buyer state</text>
<polyline points="536,317 584,317" fill="none" stroke="#2458B5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="536,541 584,541" fill="none" stroke="#2458B5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
<polyline points="1140,317 1171,317 1171,428 1201,428" fill="none" stroke="#6650A8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<polyline points="1140,541 1171,541 1171,428 1201,428" fill="none" stroke="#6650A8" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect x="1212" y="282" width="636" height="290" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="1212" y="302" width="5" height="250" rx="2" fill="#087E79"/>
<text x="1238" y="326" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#087E79" text-anchor="start" data-max-width="584">METRICFLOW</text>
<text x="1238" y="366.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="584">Drill-across → metric</text>
<text x="1238" y="416.99" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="584">Join kết quả đã aggregate, không join fact rows</text>
<text x="1238" y="464.73" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="584">AOV = tổng tử số / tổng mẫu số</text>
<text x="1238" y="512.47" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="584">Mẫu số 0 → null; làm tròn khi hiển thị</text>
<polyline points="1530,572 1530,639" fill="none" stroke="#087E79" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="1212" y="647" width="636" height="110" rx="18" fill="#E5F5F1"/>
<text x="1240" y="689" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087E79" text-anchor="start" data-max-width="580">5 VERSIONED EXPORTS → METABASE</text>
<text x="1240" y="731" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="580">KPI chung; không viết lại công thức từng chart</text>
<rect x="72" y="671" width="1058" height="155" rx="18" fill="#FCECEF"/>
<text x="96" y="709" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#AE3949" text-anchor="start" data-max-width="1010">VÍ DỤ TỔNG HỢP: JOIN NHÂN SỐ LIỆU</text>
<text x="96" y="741.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="1010">1 đơn × 2 item × 2 payment: tổng item đúng = 150; join chéo ra 300. Giữ nguyên</text>
<text x="96" y="775.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="1010">grain và aggregate riêng để loại fanout.</text>
<rect x="72" y="851" width="1058" height="127" rx="18" fill="#EAF1FD"/>
<text x="96" y="889" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#2458B5" text-anchor="start" data-max-width="1010">DIMENSION PHẢI PHÙ HỢP METRIC</text>
<text x="96" y="921.0" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="1010">Item metrics dùng category/seller. AOV và tổng đơn chỉ dùng dimension chung theo</text>
<text x="96" y="954.35" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="1010">hợp đồng; không tự phân bổ xuống item.</text>
<rect x="1212" y="795" width="636" height="183" rx="18" fill="#FFF3DD"/>
<text x="1236" y="833" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#966119" text-anchor="start" data-max-width="588">DISTINCT KHÔNG CỘNG DỒN</text>
<text x="1236" y="865.0" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="588">Khách xuất hiện nhiều ngày/bang vẫn là một</text>
<text x="1236" y="898.35" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="588">khách ở tổng kỳ. Query trực tiếp tại đúng</text>
<text x="1236" y="931.7" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="588">period/group; không SUM các distinct con.</text>
</svg>
