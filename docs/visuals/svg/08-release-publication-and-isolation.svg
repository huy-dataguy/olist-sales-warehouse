<text x="1010" y="317.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="356">MetricFlow bind R1</text>
<text x="1010" y="367.99" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">5 exports cùng release</text>
<text x="1010" y="414.35" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">SQL / semantic parity đạt</text>
<rect x="1440" y="273" width="408" height="235" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
