<text x="1060" y="670" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="740">Mọi card cùng release_id; link R0 còn hợp lệ khi được giữ lại</text>
<polyline points="1644,508 1644,547" fill="none" stroke="#087E79" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect x="72" y="753" width="556" height="216" rx="18" fill="#FCECEF"/>
<text x="96" y="791" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#AE3949" text-anchor="start" data-max-width="508">R1 LỖI / EXPORT THIẾU</text>
<text x="96" y="823.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">Không đổi pointer. Giữ R0. Candidate +</text>
<text x="96" y="857.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">logs còn để chẩn đoán và chạy lại có</text>
<text x="96" y="892.6" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">kiểm soát.</text>
<rect x="682" y="753" width="556" height="216" rx="18" fill="#FFF3DD"/>
<text x="706" y="791" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#966119" text-anchor="start" data-max-width="508">STALE OWNER / ACK BỊ MẤT</text>
<text x="706" y="823.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">Fence hết hạn không được publish. Mất</text>
<text x="706" y="857.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">ACK sau commit: tra release đã publish,</text>
<text x="706" y="892.6" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">không giả định rollback.</text>
<rect x="1292" y="753" width="556" height="216" rx="18" fill="#EAF1FD"/>
<text x="1316" y="791" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#2458B5" text-anchor="start" data-max-width="508">RANH GIỚI GIAO DỊCH</text>
<text x="1316" y="823.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">Atomic trong PostgreSQL. Metabase</text>
<text x="1316" y="857.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">link/API là bước bàn giao riêng; lỗi bàn</text>
<text x="1316" y="892.6" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="508">giao ghi nhận delivery lag.</text>
