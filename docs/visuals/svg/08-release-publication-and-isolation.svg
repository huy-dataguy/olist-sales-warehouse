<text x="100" y="605" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#087E79" text-anchor="start" data-max-width="1780">CONSUMER PATH</text>
<text x="100" y="651" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="840">R0 vẫn phục vụ trong khi R1 được kiểm tra</text>
