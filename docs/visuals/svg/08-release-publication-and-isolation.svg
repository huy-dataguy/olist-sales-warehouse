<text x="1848" y="53" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52647B" text-anchor="end" data-max-width="1808">DESIGN BASELINE 2.0  /  15.10.2026</text>
<text x="72" y="123" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="1776">Không để pipeline chạy dở làm sai báo cáo</text>
<text x="72" y="169" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="1776">Một release gắn cả dimensions, facts và metric exports; dữ liệu candidate chưa được BI nhìn thấy.</text>
