<text x="1848" y="1046" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#52647B" text-anchor="end" data-max-width="1808">THIẾT KẾ, CHƯA NGHIỆM THU HỆ THỐNG   |   08 / 09</text>
