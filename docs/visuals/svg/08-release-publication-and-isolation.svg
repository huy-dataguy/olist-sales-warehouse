<text x="98" y="367.99" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">Nguồn và version cố định</text>
<text x="98" y="414.35" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="356">Working build + DQ gates</text>
