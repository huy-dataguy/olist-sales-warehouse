<text x="96" y="881.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="808">Giữ bản published trước; log + failed state; không promote</text>
<text x="96" y="915.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="808">candidate lỗi. Chẩn đoán rồi retry/resume đúng batch/cut.</text>
<rect x="960" y="811" width="888" height="158" rx="18" fill="#E5F5F1"/>
<text x="984" y="849" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087E79" text-anchor="start" data-max-width="840">CHẠY LẠI AN TOÀN</text>
<text x="984" y="881.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="840">Same revision + hash → no-op nghiệp vụ. Receipt vẫn được audit.</text>
<text x="984" y="915.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="840">Source conflict → quarantine; stale fence → từ chối publish.</text>
