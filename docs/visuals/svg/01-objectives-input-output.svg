<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">Từ dữ liệu rời rạc đến số liệu đáng tin cậy</title>
<desc id="desc">Mục tiêu: cùng một định nghĩa, cùng một phiên bản dữ liệu, có thể đối soát và khôi phục.. Sơ đồ thiết kế; chưa nghiệm thu runtime.</desc>
<defs>
