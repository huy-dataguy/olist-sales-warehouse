<text x="96" y="759.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="808">Business/Analyst: xem bán hàng, khách hàng, danh mục.</text>
<text x="96" y="793.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="808">DE/Operator: truy vết, xử lý lỗi, chạy lại và khôi phục.</text>
<rect x="960" y="689" width="888" height="142" rx="18" fill="#E5F5F1"/>
<text x="984" y="727" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#087E79" text-anchor="start" data-max-width="840">THÀNH CÔNG ĐƯỢC ĐO BẰNG GÌ?</text>
<text x="984" y="759.0" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="840">Số liệu đối soát đúng; replay không nhân đôi; lỗi không được publish;</text>
<text x="984" y="793.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="840">SQL, semantic và BI cùng định nghĩa.</text>
<rect x="72" y="857" width="1776" height="112" rx="18" fill="#FFF3DD"/>
<text x="96" y="895" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#966119" text-anchor="start" data-max-width="1728">NGOÀI PHẠM VI</text>
<text x="96" y="927.0" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#15283E" text-anchor="start" data-max-width="1728">Telesales • dữ liệu bệnh nhân • MPP • streaming • HA đa máy. Không gán ngành dược cho dữ liệu thương mại Olist.</text>
