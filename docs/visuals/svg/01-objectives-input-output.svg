<rect x="1292" y="270" width="556" height="380" rx="18" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="2"/>
<rect x="1292" y="290" width="5" height="340" rx="2" fill="#087E79"/>
<text x="1318" y="314.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="504">Dữ liệu và kết quả có thể dùng</text>
<text x="1318" y="364.99" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">7 dimensions + 3 facts</text>
<text x="1318" y="414.11" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">8 KPI dùng chung, 5 metric exports</text>
<text x="1318" y="463.23" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">3 dashboard: sales, commercial, health</text>
<text x="1318" y="512.35" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">SQL phân tích + lineage + evidence</text>
