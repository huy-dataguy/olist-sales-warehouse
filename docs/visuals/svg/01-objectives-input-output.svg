<rect x="682" y="290" width="5" height="340" rx="2" fill="#6650A8"/>
<text x="708" y="314.0" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="504">Một nguồn phân tích nhất</text>
<text x="708" y="351.99" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#15283E" text-anchor="start" data-max-width="504">quán</text>
<text x="708" y="402.98" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">Ingest → kiểm tra → hợp nhất</text>
<text x="708" y="452.1" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">Kimball Warehouse + dbt</text>
<text x="708" y="501.22" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">Semantic Layer + metric exports</text>
