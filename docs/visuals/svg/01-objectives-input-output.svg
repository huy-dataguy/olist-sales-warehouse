<text x="98" y="496.35" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">Snapshot + checksum + provenance</text>
<text x="98" y="545.47" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">Fixture lỗi/cập nhật tách riêng dữ liệu</text>
<text x="98" y="578.59" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#52647B" text-anchor="start" data-max-width="504">thật</text>
