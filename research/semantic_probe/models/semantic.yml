version: 2
models:
  - name: time_spine
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
  - name: fct_orders
    semantic_model:
      enabled: true
    agg_time_dimension: order_date
    columns:
      - name: order_id
        entity:
          type: primary
          name: order
      - name: customer_key
        entity:
          type: foreign
          name: customer
      - name: order_date
        granularity: day
        dimension:
          type: time
      - name: buyer_geography_key
        entity:
          type: foreign
          name: buyer_geography
    metrics:
      - name: delivered_orders
        label: Delivered Orders
        type: simple
        agg: sum
        expr: delivered_order_count
  - name: fct_order_items
    semantic_model:
      enabled: true
    agg_time_dimension: order_date
    columns:
      - name: order_item_key
        entity:
          type: primary
          name: order_item
      - name: product_key
        entity:
          type: foreign
          name: product
      - name: buyer_geography_key
        entity:
          type: foreign
          name: buyer_geography
      - name: order_date
        granularity: day
        dimension:
          type: time
    metrics:
      - name: delivered_merchandise_value
        label: Delivered Merchandise Value
        type: simple
        agg: sum
        expr: delivered_merchandise_value
  - name: dim_products
    semantic_model:
      enabled: true
    columns:
      - name: product_key
        entity:
          type: primary
          name: product
      - name: category
        dimension:
          type: categorical
  - name: dim_buyer_geography
    semantic_model:
      enabled: true
    columns:
      - name: buyer_geography_key
        entity:
          type: primary
          name: buyer_geography
      - name: state
        dimension:
          type: categorical
metrics:
  - name: delivered_aov
    label: Delivered Average Order Value
    type: ratio
    type_params:
      numerator: delivered_merchandise_value
      denominator: delivered_orders
